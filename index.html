let ac=null,muted=false;
function audioInit(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(ac&&ac.state==='suspended')ac.resume();
}
function tone(f,d,type,v,slide){
  if(!ac||muted)return;
  const t0=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t0+d);
  g.gain.setValueAtTime(v||.06,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);
  o.connect(g);g.connect(ac.destination);o.start();o.stop(t0+d);
}
function noise(d,v){
  if(!ac||muted)return;
  const n=(ac.sampleRate*d)|0,buf=ac.createBuffer(1,n,ac.sampleRate),da=buf.getChannelData(0);
  for(let i=0;i<n;i++)da[i]=(Math.random()*2-1)*(1-i/n);
  const s=ac.createBufferSource();s.buffer=buf;
  const g=ac.createGain();g.gain.value=v;
  const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=900;
  s.connect(f);f.connect(g);g.connect(ac.destination);s.start();
}

const MUS={on:false,next:0,step:0,timer:null,nb:null};
const mf=m=>440*Math.pow(2,(m-69)/12);
function mtone(f,t0,d,type,v,slide,lp){
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t0+d);
  g.gain.setValueAtTime(.0001,t0);g.gain.linearRampToValueAtTime(v,t0+.008);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  let n=o;
  if(lp){const fl=ac.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;o.connect(fl);n=fl}
  n.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+d+.02);
}
function mnoise(t0,d,v,hp){
  if(!MUS.nb){
    const n=ac.sampleRate,b=ac.createBuffer(1,n,ac.sampleRate),da=b.getChannelData(0);
    for(let i=0;i<n;i++)da[i]=Math.random()*2-1;MUS.nb=b;
  }
  const s=ac.createBufferSource();s.buffer=MUS.nb;
  const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=hp;
  const g=ac.createGain();g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  s.connect(f);f.connect(g);g.connect(ac.destination);s.start(t0,Math.random()*.5);s.stop(t0+d+.02);
}
const M_ROOT=[33,33,29,28];                       // A A F E：帶有緊張感的下行
const M_MEL=[[0,76,4],[4,74,2],[6,72,2],[8,69,6],[14,72,2],[16,76,4],[20,79,4],[24,76,4],[28,74,4],
  [32,77,4],[36,76,2],[38,74,2],[40,72,6],[46,74,2],[48,76,6],[54,75,2],[56,76,4],[60,71,4]];
function musStep(st,t0,lvl){
  const bar=(st>>4)&3,s=st&15,root=M_ROOT[bar];
  // 戰鼓
  if(s===0||s===8)mtone(125,t0,.3,'sine',.26,-70);
  if(s===6||s===14||(lvl>0&&s===10))mtone(150,t0,.18,'sine',.13,-80);
  if(lvl>0&&(s===4||s===12))mnoise(t0,.12,.08,1800);
  if(lvl>0?(s%2===0):(s%4===2))mnoise(t0,.04,.035,6500);
  // 低音
  const bassOn=lvl>0?(s%2===0):[0,4,6,8,12,14].includes(s);
  if(bassOn)mtone(mf(root+((s===6||s===14)?12:0)),t0,.2,'sawtooth',s===0?.1:.065,0,380);
  // 不安的高音（第一階段）
  if(lvl===0&&s===0&&(bar&1)===0)mtone(mf(81+(bar?1:0)),t0,1.6,'sine',.02,0);
  // 旋律
  if(lvl>=1){
    for(const m of M_MEL)if(m[0]===(st%64)){
      mtone(mf(m[1]),t0,m[2]*60/(lvl>1?150:132)/4*.95,'square',.034,0,2600);
      mtone(mf(m[1])*1.003,t0,m[2]*60/(lvl>1?150:132)/4*.95,'sawtooth',.02,0,2200);
    }
  }
  // Boss：十六分音符琶音＋警報和弦
  if(lvl>=2){
    const arp=[0,3,7,12,7,3,0,-2];
    mtone(mf(root+24+arp[s%8]),t0,.09,'square',.03,0,2000);
    if(s===0)mtone(mf(root+36),t0,.5,'sawtooth',.03,0,1500),mtone(mf(root+42),t0,.5,'sawtooth',.025,0,1500);
  }
}

function storyStep(st,t0,page){
  const s=st&15,bar=(st>>4)&7,root=[33,33,29,31,33,33,28,28][bar];
  if(s===0)mtone(mf(root+12),t0,1.7,'triangle',.07,0,600),mtone(mf(root+19),t0,1.7,'sine',.03,0);

    mtone(mf(m[1]),t0,d,'triangle',.05,0,2400);mtone(mf(m[1])*2,t0,d*.6,'sine',.012,0);
  }
}
function musTick(){
  if(!ac)return;
  if(state!=='play'&&state!=='night'&&state!=='story'&&state!=='title'){musStop();return}
  if(paused||muted){MUS.next=ac.currentTime+.1;return}
  if(state==='story'||state==='title'){
    while(MUS.next<ac.currentTime+.2){storyStep(MUS.step,MUS.next,state==='title'?1:storyPage);MUS.next+=60/84/4;MUS.step++}

  while(MUS.next<ac.currentTime+.2){
    musStep(MUS.step,MUS.next,lvl);
    MUS.next+=60/bpm/4;MUS.step++;
  }
}
function musStart(){
  if(!ac||MUS.on)return;

/* ====== 像素繪圖工具 ====== */
function R(c,x,y,w,h){
  ctx.fillStyle=c;
  const w2=w>0?Math.max(1,rnd(w)):0,h2=h>0?Math.max(1,rnd(h)):0;
  ctx.fillRect(rnd(x),rnd(y),w2,h2);
}
function spr(map,pal,x,y,px){
  for(let j=0;j<map.length;j++){
    const row=map[j];
    for(let i=0;i<row.length;i++){
      const ch=row[i];if(ch==='.')continue;
      ctx.fillStyle=pal[ch];
      ctx.fillRect(rnd(x+i*px),rnd(y+j*px),px+.4,px+.4);
    }
  }
}
function txt(s,x,y,size,color,align,stroke,sw){
  ctx.font='bold '+size+'px "PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC",sans-serif';
  ctx.textAlign=align||'center';ctx.textBaseline='middle';ctx.lineJoin='round';
  if(stroke!==null){ctx.strokeStyle=stroke||'#1a0606';ctx.lineWidth=sw||4;ctx.strokeText(s,x,y)}
  ctx.fillStyle=color;ctx.fillText(s,x,y);
}
function hex(c){return [1,3,5].map(i=>parseInt(c.substr(i,2),16))}
function lerpC(a,b,t){const A=hex(a),B=hex(b);return 'rgb('+A.map((v,i)=>rnd(v+(B[i]-v)*t)).join(',')+')'}

  }
  return STOPS[3][1];
}

function tileRoof(cx,top,h,topW,botW,tip){
  for(let r=0;r<h;r+=2){
    const w=topW+(botW-topW)*r/h,x=cx-w/2;
    R(r>h*.78?'#8a2e22':'#a8402e',x,top+r,w,2);
    for(let i=2;i<w-1;i+=4)R('#cc6040',x+i,top+r,1,2);
  }
  R('#ecd08a',cx-botW/2,top+h,botW,2);
  R('#6a1e18',cx-botW/2,top+h+2,botW,2);
  R('#e0b040',cx-topW/2-2,top-3,topW+4,3);
  for(let i=0;i<topW;i+=6)R('#2aa060',cx-topW/2+i,top-5,3,2);
  if(tip){
    for(const sd of [-1,1]){
      const x0=cx+sd*botW/2,y0=top+h;
      for(let k=0;k<8;k++){
        const x=x0+sd*k*2.2-(sd<0?3:0),y=y0-2-Math.pow(k,1.7)*.55;
        R(k>5?'#e8b830':'#a8402e',x,y,3,3);
        R('#ecd08a',x,y+3,3,1);
      }
    }
  }
}
function ornRow(x,y,w,h,seed){
  const pal=['#e8b830','#2aa060','#d8281c','#2a8a9a','#f0e0b0','#c06020'];
  for(let j=0;j<h;j+=3)for(let i=0;i<w;i+=3){
    const n=hs(i*131+j*17+seed);
    if(n%100<80)R(pal[n%pal.length],x+i,y+j,3,3);
  }
}
function ornTri(cx,baseY,w,h,seed,fin){
  const pal=['#e8b830','#2aa060','#d8281c','#2a8a9a','#f0e0b0','#c06020','#e8b830'];
  for(let j=0;j<h;j+=3){
    const rw=w*(1-Math.pow(j/h,1.6)*.8);
    for(let i=-rw/2;i<rw/2;i+=3){
      const n=hs((rnd(i)+200)*131+j*17+seed);
      if(n%100<78)R(pal[n%pal.length],cx+i,baseY-j-3,3,3);

    R('#e8b830',cx-1,baseY-h-14,2,14);R('#d8281c',cx-4,baseY-h-8,8,3);R('#e8b830',cx-3,baseY-h-5,6,2);

}
function dragon(x,y,dir,len){
  for(let i=0;i<len;i++){
    const px=x+dir*i*2.4,py=y-Math.sin(i*.5)*5-i*.5;
    R(i%2?'#2aa060':'#e8b830',px,py,3,3);
    if(i%4===0)R('#d8281c',px,py-2,2,2);
  }
  const hx=x+dir*len*2.4,hy=y-Math.sin(len*.5)*5-len*.5;
  R('#e8b830',hx-(dir<0?3:0),hy-2,6,5);R('#d8281c',hx+(dir>0?3:-2),hy-1,2,2);R('#fff',hx+(dir>0?4:-3),hy+1,2,1);

}

/* ---- 三合院（紅磚牆、燕尾脊、護龍） ---- */
function hz(h){
  const m=c=>h?lerpC(c,HAZE,h):c;
  return {brick:m('#a64a2c'),brickD:m('#84361f'),roof:m('#8a3326'),roofH:m('#b04a34'),dark:m('#2a1410'),floor:m('#b09a7c'),gold:m('#d8a838'),win:'#ffcf5a'};
}
function sanhe(cx,by,s,haze){
  const c=hz(haze),S=v=>Math.max(1,rnd(v*s));
  const mw=S(60),mh=S(22),rh=S(15),my=by-S(8),ww=S(16),wh=S(15),gh=S(10),mx=cx-mw/2;
  R(c.floor,cx-mw/2+ww-S(4),my,mw-2*ww+S(8),by-my+1);
  R(c.brick,mx,my-mh,mw,mh);
  if(s>=.6)for(let j=0;j<mh;j+=3)R(c.brickD,mx,my-mh+j,mw,1);
  R(c.dark,cx-S(5),my-S(13),S(10),S(13));R(c.gold,cx-S(5),my-S(13),S(10),Math.max(1,S(1.5)));
  for(const o of [-20,15]){
    const wx=rnd(cx+o*s),wy=my-S(16);
    R(c.win,wx,wy,S(5),S(5));
    if(collectWin)winList.push({x:wx,y:wy,w:S(5),h:S(5)});
  }
  const top=my-mh-rh,topW=mw*.74,botW=mw+S(10);
  for(let r=0;r<rh;r++){const w=topW+(botW-topW)*r/rh;R(r%3===2?c.roofH:c.roof,cx-w/2,top+r,w,1)}
  R(c.gold,cx-topW/2,top-1,topW,1);
  for(const sd of [-1,1])for(let k=0;k<5;k++)R(c.roof,cx+sd*botW/2+sd*k*S(2)-(sd<0?2:0),top+rh-2-k*k*.4*s*1.5,Math.max(1,S(2)),Math.max(1,S(2)));
  for(const sd of [-1,1]){
    const wx=sd<0?cx-mw/2-S(4):cx+mw/2-ww+S(4);
    R(c.brick,wx,by-wh,ww,wh);
    R(c.dark,wx+ww/2-S(2),by-S(9),S(4),S(9));
    for(let r=0;r<gh;r++){const w=ww+S(5)-r*(ww+S(3))/gh;R(r%2?c.roofH:c.roof,wx+ww/2-w/2,by-wh-r-1,Math.max(1,w),1)}
    R(c.roof,wx+ww/2-1,by-wh-gh-S(3),2,S(3));
  }
}
function palm(x,by,h,haze){
  const g=haze?lerpC(PAL.palm,HAZE,haze):PAL.palm,tr=haze?lerpC('#4a2a1a',HAZE,haze):'#4a2a1a';
  R(tr,x-1,by-h,Math.max(2,h/16),h);
  ctx.strokeStyle=g;ctx.lineWidth=Math.max(1.5,h/20);ctx.lineCap='butt';
  const L=h*.4;
  for(const [dx,dy] of [[-1,.5],[-.8,.1],[-.4,-.3],[0,-.45],[.4,-.3],[.8,.1],[1,.5]]){
    ctx.beginPath();ctx.moveTo(x,by-h);
    ctx.quadraticCurveTo(x+dx*L*.5,by-h-L*.35,x+dx*L,by-h+dy*L);ctx.stroke();
  }
}

function cutPoly(pts){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill()}
function rubble(cx,by,w,h,seed){
  const cols=['#8a3a28','#6a2a1c','#3a2a28','#a8a090','#5a4038','#2a1a18'];
  for(let i=0;i<w*h/6;i++){
    const n=hs(seed*997+i*13);
    const x=cx-w/2+(n%Math.max(1,rnd(w)));
    const top=h*(1-Math.abs((x-cx)/(w/2)));
    const y=by-((n>>8)%Math.max(1,rnd(top)+1));
    R(cols[(n>>16)%cols.length],x,y,3+(n>>20)%4,2+(n>>22)%3);
  }
}
function crater(cx,cy,rw,rh){
  for(let j=-rh;j<=rh;j++){const w=rw*Math.sqrt(1-(j/rh)*(j/rh));R('#3a2620',cx-w,cy+j,w*2,1)}
  R('#8a7060',cx-rw,cy-rh-1,rw*2,1);
}

const TIPS={cl:'集束炸彈：會在空中分裂，趁早撥開！',hv:'重磅炸彈：要撥兩次！落地扣'+CFG.heavyPenalty,dv:'俯衝炸彈：急速俯衝！落地扣'+CFG.divePenalty};
let best=0;try{best=+localStorage.getItem('mazuBest')||0}catch(e){}

function reset(){
  t=0;score=CFG.startScore;phase2=false;announce=0;endT=0;loseT=0;fwT=0;paused=false;
  bombs=[];charms=[];parts=[];floaters=[];trail=[];fxBooms=[];villagers=[];
  nextCharm=3.5;shake=0;flash=0;glow=0;
  Object.assign(planes[0],{x:200,dir:1,drop:0,on:true,nb:1});
  Object.assign(planes[1],{x:-80,dir:1,drop:0,on:false,nb:2});
  stats={deflected:0,hit:0,knocked:0,charms:0,swept:0};
  combo=0;maxCombo=0;tip.t=0;seenTypes={};lastHitT=-99;chain=0;
  egg.planned=Math.random()<CFG.eggChance;egg.done=false;egg.at=rand(CFG.eggWindow[0],CFG.eggWindow[1]);cake=null;cakeG=null;eater=null;
  Object.assign(boss,{on:false,dead:false,dieT:0,x:-140,dir:1,hp:CFG.bossHP,hit:0,nb:1.2});
  bonusUnlocked=false;bonusPlayed=false;loseNight=false;bats=[];rings=[];flashes=[];lp=null;nEnding=false;BTN.y=404;ns.caught=0;ns.timeout=0;ns.incomplete=0;
}
function startGame(){reset();state='play';musStop();musStart()}
function startBonusTest(){reset();bonusUnlocked=true;state='play';enterStory()}

function planeSpeed(p){
  let v;
  if(state==='play')v=t<CFG.phaseAt?CFG.speed1:CFG.speed2+(t-CFG.phaseAt)*1.2;
  else if(state==='lose')v=100;
  else v=80;
  return v*(p.s===1?1:.78);
}

function boom(x,y,big){
  fxBooms.push({x,y,age:0,max:big?.6:.4,R:big?50:26});
  const FIRE=['#fff3b0','#ffb020','#e2401c','#7a1d10'];
  const n=big?30:14;
  for(let i=0;i<n;i++){
    const a=rand(0,6.283),sp=rand(40,big?280:170);
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-40,life:rand(.4,.9),max:.9,c:pick(FIRE),s:pick([3,3,4,6]),g:260,grow:0,a:1});
  }
  if(big)for(let i=0;i<8;i++)parts.push({x:x+rand(-14,14),y:y-6,vx:rand(-20,20),vy:-rand(20,50),life:rand(1,2),max:2,c:'#2a0d0a',s:8,g:-10,grow:10,a:.6});
}
function sparks(x,y,cols,n,sp){
  for(let i=0;i<n;i++){
    const a=rand(0,6.283),s=rand(30,sp);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.3,.7),max:.7,c:pick(cols),s:pick([3,3,4]),g:120,grow:0,a:1});
  }
}
function floater(x,y,text,c,size){floaters.push({x,y,text,c,size:size||20,life:1.1,max:1.1})}

const mult=()=>Math.min(CFG.comboMax,1+Math.floor(combo/CFG.comboStep));
function gain(base,x,y){
  combo++;if(combo>maxCombo)maxCombo=combo;
  const m=mult(),pts=base*m;score+=pts;
  floater(x,y,'+'+pts+(m>1?' ×'+m:''),m>1?'#ffd24a':'#7dff9a',m>1?26:24);
  if(m>1&&combo%CFG.comboStep===0){floater(200,320,'連擊 ×'+m+'！','#ffd24a',30);sfx.combo(m)}
}
function breakCombo(){if(combo>=3)floater(200,320,'連擊中斷','#ff8a6a',20);combo=0}
function pickType(){
  if(t<10)return 'n';
  const r=Math.random();
  if(t<CFG.phaseAt){if(r<.12)return 'cl';if(r<.22&&t>=15)return 'hv';return 'n'}
  if(r<.15)return 'cl';if(r<.28)return 'hv';if(r<.43)return 'dv';return 'n';
}
function newBomb(x,y,vx,vy,s0,type){
  const mul=type==='hv'?1.4:type==='cl'?1.1:1;
  return{
    x:clamp(x,20,380),y,vx,vy,s:s0*mul,s0,type,
    sf:(.8+.35*(s0-.7)/.6)*(type==='hv'?.82:1),landY:598+(s0-.7)/.6*52,
    rot:0,spin:0,age:0,state:'fall',noHit:false,dt:0,dead:false,
    hp:type==='hv'?2:1,cd:0,pen:type==='hv'?CFG.heavyPenalty:type==='dv'?CFG.divePenalty:CFG.bombPenalty,
    diveY:rand(190,260),dvT:0,dvGo:false,split:rand(270,340)
  };
}
function introType(type){
  if(type==='n'||seenTypes[type])return;
  seenTypes[type]=1;tip.text=TIPS[type];tip.t=3.2;
}
function dropBomb(p,offx,type){
  type=type||pickType();
  const sp=planeSpeed(p),s0=p===planes[0]?rand(.95,1.25):rand(.7,.85);
  bombs.push(newBomb(p.x-p.dir*3+(offx||0),p.y+19*p.s,p.dir*sp*.35+rand(-15,15),50,s0,type));
  introType(type);
  p.drop=.18;
  if(p===planes[0])sfx.drop();
}
function bossDrop(){
  const type=pickType();
  bombs.push(newBomb(boss.x+rand(-30,30),boss.y+34,rand(-25,25),50,rand(.95,1.2),type));
  introType(type);sfx.drop();
}
function bossHit(b){
  boss.hp--;boss.hit=.18;
  boom(b.x,b.y,false);sfx.bossHit();shake=.25;
  floater(b.x,b.y-10,'命中！','#ffd24a',22);
  if(boss.hp<=0&&!boss.dead){
    boss.dead=true;boss.dieT=0;
    score+=CFG.bossBonus;flash=.9;shake=.7;
    floater(200,300,'擊落 Boss！ +'+CFG.bossBonus,'#ffd24a',32);
    sfx.boom();setTimeout(()=>sfx.win(),200);
    for(const q of bombs){if(q.state==='fall'){q.state='def';q.vx=rand(-200,200);q.vy=-rand(150,300);q.spin=rand(-10,10);q.dt=rand(.15,.5)}}
  }
}
function spawnCharm(){
  charms.push({x0:rand(50,350),x:0,y:-24,vy:phase2?105:85,age:0,ph:rand(0,6),r:20,landY:616,dead:false});
}

/* ====== 判定：往上或左右撥開成功，往下撥則失敗 ====== */
function dseg(px,py,x0,y0,x1,y1){
  const dx=x1-x0,dy=y1-y0,l2=dx*dx+dy*dy;
  let u=l2?((px-x0)*dx+(py-y0)*dy)/l2:0;u=clamp(u,0,1);
  return Math.hypot(px-(x0+u*dx),py-(y0+u*dy));
}
function bombHit(b,x0,y0,x1,y1){
  const ax=-Math.sin(b.rot),ay=Math.cos(b.rot),h=20*b.s,r=12*b.s+CFG.hitPad;
  for(let k=-2;k<=2;k++)if(dseg(b.x+ax*h*k/2,b.y+ay*h*k/2,x0,y0,x1,y1)<=r)return true;
  return false;
}
// (x0,y0)-(x1,y1)：這一小段實際軌跡；(dx,dy)：平滑後的撥動方向
function slash(x0,y0,x1,y1,dx,dy){
  if(state!=='play'||paused)return;
  const len=Math.hypot(dx,dy);
  if(len<3)return;                       // 沒有明確方向（單純點一下）不算撥動
  if(clock-lastSlash>.1){lastSlash=clock;sfx.slash()}
  const ux=dx/len,uy=dy/len,sp=420+Math.min(len,60)*4;
  for(const b of bombs){
    if(b.state!=='fall'||b.noHit||b.cd>0)continue;
    if(!bombHit(b,x0,y0,x1,y1))continue;
    if(uy<CFG.downLimit){
      if(b.hp>1){
        // 重磅炸彈：第一下只是打偏，要再撥一次
        b.hp--;b.cd=.3;b.vy=-110;b.vx+=ux*90;
        sparks(b.x,b.y,['#fff','#ffb020'],10,200);
        floater(b.x,b.y-24,'再撥一次！','#ffd24a',20);sfx.clang();continue;
      }
      // 往上或左右：彈飛成功
      b.state='def';
      b.vx=ux*sp;b.vy=Math.min(uy*sp-120,-50);
      b.spin=(Math.random()<.5?-1:1)*rand(8,14);b.dt=(boss.on&&!boss.dead)?.85:.5;
      stats.deflected++;
      gain(b.type==='hv'?CFG.heavyBonus:b.type==='cl'?CFG.clusterBonus:b.type==='dv'?CFG.diveBonus:CFG.deflectBonus,b.x,b.y-20);
      sparks(b.x,b.y,['#fff','#ffe27a','#ffb020'],10,220);
      sfx.deflect();
    }else{
      // 往下撥：炸彈被打向地面，仍會造成損失
      b.noHit=true;b.knocked=true;
      b.vx=ux*120;b.vy=Math.max(b.vy,260);
      stats.knocked++;breakCombo();
      sparks(b.x,b.y,['#ff6a4a','#ffb020'],8,160);
      floater(b.x,b.y-20,'往下撥了！','#ff8a6a',18);
      sfx.wrong();
    }
  }
  if(cake&&!cake.dead&&dseg(cake.x,cake.y,x0,y0,x1,y1)<=22+CFG.hitPad){
    cake.dead=true;cake=null;sparks(x0,y0,['#e8a640','#f4e2a8'],6,100);sfx.poof();   // 被揮走：什麼事也不會發生
  }
  for(const c of charms){
    if(c.dead)continue;
    if(dseg(c.x,c.y,x0,y0,x1,y1)<=c.r+CFG.hitPad){
      c.dead=true;stats.swept++;
      sparks(c.x,c.y,['#d8c46a','#9a8a50','#fff'],10,120);
      floater(c.x,c.y,'符咒被揮散…','#cfc7a0',16);
      sfx.poof();
    }
  }
}

const SHIRTS=['#c8402e','#3a6aa8','#e8c040','#4a8a4a','#f0f0e0','#a04a8a','#d8782a'];
function winSetup(){
  endT=0;loseT=0;fwT=0;paused=false;
    state='win';
    for(const b of bombs){if(b.state==='fall'){b.state='def';b.vx=rand(-200,200);b.vy=-rand(150,300);b.spin=rand(-10,10);b.dt=rand(.15,.5)}}
    charms=[];bgBooms=[];decorBombs=[];flash=.6;cake=null;cakeG=null;eater=null;
    villagers=[];
    for(let i=0;i<11;i++){
      const y=rand(610,692);
      villagers.push({x:rand(24,376),y,s:.7+(y-600)/92*.55,shirt:pick(SHIRTS),hat:Math.random()<.4,kid:Math.random()<.25,ph:rand(0,6)});
    }
    villagers.sort((a,b)=>a.y-b.y);
    if(score>best){best=score;try{localStorage.setItem('mazuBest',String(best))}catch(e){}}
    sfx.win();
  BTN.y=bonusPlayed?434:404;
}
function finish(win){
  if(state!=='play')return;
  endT=0;loseT=0;fwT=0;paused=false;
  if(win){
    if(bonusUnlocked&&!bonusPlayed){enterStory();return}
    winSetup();
  }else{
    state='lose';score=0;cake=null;cakeG=null;eater=null;sfx.lose();
  }
}

/* ====== 更新 ====== */
function update(dt){
  clock+=dt;
  if(state==='lose'&&loseNight)updPanic(dt);
  if(state==='story'){storyT+=dt;for(const c of nClouds){c.x+=c.s*dt;if(c.x>W+20)c.x=-c.w-20}updFx(dt);return}
  if(state==='night'){updateNight(dt);return}
  for(const c of dayClouds){c.x+=c.s*dt;if(c.x>420)c.x=-c.w}
  if(state!=='win'){
    bgTimer-=dt;
    if(bgTimer<=0){
      bgTimer=rand(.22,.6);
      const r=Math.random();
      if(r<.5)bgBooms.push({x:rand(20,380),y:rand(140,420),age:0,max:rand(.7,1.2),R:rand(22,56),k:0});
      else if(r<.8)bgBooms.push({x:rand(10,390),y:rand(470,525),age:0,max:rand(.6,1),R:rand(14,30),k:0});
      else bgBooms.push({x:rand(20,380),y:rand(130,340),age:0,max:rand(1.2,2),R:rand(10,18),k:1,sd:(Math.random()*999)|0});
      if(Math.random()<.25)skyFlash=.25;
    }
    for(const d of decor){
      d.x+=d.dir*d.v*dt;
      if(d.x>460)d.x=-60;if(d.x<-60)d.x=460;
      d.t-=dt;
      if(d.t<=0){d.t=rand(2.5,5);decorBombs.push({x:d.x,y:d.y+6,vy:60,ly:rand(485,530)})}
    }
  }
  for(const b of bgBooms)b.age+=dt;
  bgBooms=bgBooms.filter(b=>b.age<b.max);
  for(const b of decorBombs){
    b.vy+=120*dt;b.y+=b.vy*dt;
    if(b.y>=b.ly){b.dead=true;bgBooms.push({x:b.x,y:b.y,age:0,max:rand(.6,.9),R:rand(14,24),k:0})}
  }
  decorBombs=decorBombs.filter(b=>!b.dead);
  for(const c of clouds){c.x-=c.s*dt;if(c.x+c.w<-10){c.x=410;c.y=rand(130,420)}}
  for(const e of embers){e.y-=e.v*dt;e.x+=Math.sin(clock*2+e.p)*10*dt;if(e.y<-4){e.y=BASE;e.x=rand(0,400)}}
  skyFlash=Math.max(0,skyFlash-dt*1.5);
  shake=Math.max(0,shake-dt);
  flash=Math.max(0,flash-dt*1.6);
  glow=Math.max(0,glow-dt*.7);
  announce=Math.max(0,announce-dt);

  for(const p of planes){
    if(!p.on)continue;
    p.x+=p.dir*planeSpeed(p)*dt;
    if(p.x>330&&p.dir>0)p.dir=-1;
    if(p.x<70&&p.dir<0)p.dir=1;
    p.drop=Math.max(0,p.drop-dt);
  }

  if(boss.on){
    boss.x+=boss.dir*(boss.dead?0:62)*dt;
    if(boss.x>300)boss.dir=-1;
    if(boss.x<110&&boss.dir<0)boss.dir=1;
    boss.hit=Math.max(0,boss.hit-dt);
    if(boss.dead){
      boss.dieT+=dt;boss.y+=40*dt;
      if(Math.random()<.5){boom(boss.x+rand(-60,60),boss.y+rand(-14,14),Math.random()<.4);}
      if(boss.dieT>1.4)boss.on=false;
    }
  }
  tip.t=Math.max(0,tip.t-dt);
  if(state==='play'){
    t+=dt;
    if(!boss.on&&!boss.dead&&t>=CFG.bossAt){
      boss.on=true;boss.x=-140;boss.dir=1;boss.y=206;boss.hp=CFG.bossHP;boss.nb=1.4;
      planes[1].on=false;
      announce=2.6;annMsg=['最後 10 秒！','Boss 來襲　落地扣分加倍'];shake=.6;sfx.alarm();
    }
    if(boss.on&&!boss.dead&&boss.x>40){
      boss.nb-=dt;
      if(boss.nb<=0){boss.nb=rand(1.0,1.5);bossDrop()}
    }
    if(!phase2&&t>=CFG.phaseAt){
      phase2=true;announce=2.2;annMsg=['轟炸加劇！','落地扣分提高　遠方轟炸機加入'];shake=.6;sfx.alarm();
      Object.assign(planes[1],{x:-80,dir:1,on:true,nb:1.2});
    }
    for(const p of planes){
      if(!p.on)continue;
      p.nb-=dt;
      if(p.nb<=0){
        const iv=p===planes[0]?(phase2?CFG.bombInt2:CFG.bombInt1):CFG.bombIntB;
        p.nb=rand(iv[0],iv[1]);
        if(p.x<20||p.x>380)continue;
        dropBomb(p,0);
        if(p===planes[0]&&phase2&&Math.random()<.15)dropBomb(p,rand(-70,70),'n');
      }
    }
    if(egg.planned&&!egg.done&&t>=egg.at){
      egg.done=true;cake={x0:rand(70,330),x:0,y:-24,vy:78,age:0,ph:rand(0,6)};
    }
    nextCharm-=dt;
    if(nextCharm<=0){
      const iv=phase2?CFG.charmInt2:CFG.charmInt1;
      nextCharm=rand(iv[0],iv[1]);
      spawnCharm();
    }
  }

  const g=phase2?CFG.g2:CFG.g1,maxV=phase2?480:400;
  for(const b of bombs){
    b.age+=dt;b.cd=Math.max(0,b.cd-dt);
    if(b.state==='fall'&&b.type==='cl'&&!b.noHit&&b.y>=b.split){
      b.dead=true;sfx.split();sparks(b.x,b.y,['#ffb020','#ff7a20','#fff'],14,200);
      for(const k of [-1,0,1]){
        const nb=newBomb(b.x+k*10,b.y,b.vx+k*85,Math.max(b.vy*.85,60),b.s0,'n');
        nb.s=b.s0*.62;nb.landY=b.landY;nb.pen=CFG.splitPenalty;bombs.push(nb);
      }
      floater(b.x,b.y-30,'散開！','#ff9a4a',20);
      continue;
    }
    if(b.state==='fall'&&b.type==='dv'&&!b.knocked&&!b.dvGo&&b.y>=b.diveY){
      b.dvT+=dt;b.vy=12;b.vx*=.2;
      if(b.dvT>=.55){b.dvGo=true;b.vy=320;sfx.dive()}
    }
    if(b.state==='fall'){
      if(b.type==='dv'&&b.dvGo&&!b.knocked)b.vy=Math.min(b.vy+900*dt,640*b.sf);
      else if(!(b.type==='dv'&&b.dvT>0&&!b.dvGo))b.vy=Math.min(b.vy+g*b.sf*dt,(b.knocked?560:maxV)*b.sf);
      b.x+=b.vx*dt;b.y+=b.vy*dt;
      b.vx*=Math.pow(.6,dt);
      if(b.x<10){b.x=10;b.vx=Math.abs(b.vx)}
      if(b.x>390){b.x=390;b.vx=-Math.abs(b.vx)}
      b.rot=Math.atan2(-b.vx,b.vy)+(b.knocked?0:Math.sin(b.age*8)*.08);
      if(Math.random()<.25)parts.push({x:b.x,y:b.y-20*b.s,vx:rand(-10,10),vy:-rand(10,40),life:.4,max:.4,c:b.knocked?'#ff6a4a':'#ffb020',s:2,g:0,grow:0,a:1});
      if(b.y>=b.landY){
        b.dead=true;
        boom(b.x,b.landY-4,true);sfx.boom();shake=.5;
        if(state==='play'){
          chain=(t-lastHitT<=CFG.chainWindow)?Math.min(CFG.chainMax,chain+1):0;lastHitT=t;
          const mulP=(boss.on&&!boss.dead)?CFG.bossPenMul:phase2?CFG.phase2PenMul:1;
          const pen=Math.round(b.pen*mulP)+chain*CFG.chainPen+(score>150?Math.round((score-150)*CFG.pctPen):0);
          score-=pen;stats.hit++;flash=1;breakCombo();
          floater(b.x,b.landY-34,'-'+pen,'#ff4a3a',26);
          if(chain>0)floater(b.x,b.landY-64,'連環爆！','#ff9a3a',18);
        }
      }
    }else{
      b.x+=b.vx*dt;b.y+=b.vy*dt;b.rot+=b.spin*dt;b.dt-=dt;
      if(boss.on&&!boss.dead&&state==='play'&&Math.abs(b.x-boss.x)<64&&Math.abs(b.y-boss.y)<30){b.dead=true;bossHit(b);continue}
      if(b.dt<=0||b.x<-30||b.x>430||b.y<-40||b.y>=b.landY){
        b.dead=true;
        boom(clamp(b.x,10,390),clamp(b.y,20,b.landY-10),false);sfx.pop();
      }
    }
  }
  bombs=bombs.filter(b=>!b.dead);

  for(const c of charms){
    c.age+=dt;c.y+=c.vy*dt;
    c.x=clamp(c.x0+Math.sin(c.age*2.2+c.ph)*24,16,384);
    if(c.y>=c.landY&&!c.dead){
      c.dead=true;
      if(state==='play'){
        score+=CFG.charmBonus;stats.charms++;glow=1.3;
        floater(c.x,c.landY-34,'+'+CFG.charmBonus,'#ffd24a',26);
        sparks(c.x,c.landY-10,['#ffd24a','#fff3b0','#ffffff'],18,200);
        sfx.chime();
      }
    }
  }
  charms=charms.filter(c=>!c.dead);

  if(cake){
    cake.age+=dt;cake.y+=cake.vy*dt;cake.x=clamp(cake.x0+Math.sin(cake.age*1.8+cake.ph)*18,20,380);
    if(cake.y>=628){
      cakeG={x:cake.x,y:632,age:0};
      sparks(cake.x,624,['#e8a640','#f4e2a8','#fff'],12,120);
      const fromL=cake.x<200;
      eater={x:fromL?-20:420,y:646,dir:fromL?1:-1,st:'run',tm:0,ph:rand(0,6),shirt:pick(SHIRTS),hat:Math.random()<.5,home:fromL?-1:1};
      cake=null;
    }
  }
  if(cakeG)cakeG.age+=dt;
  if(eater){
    const e=eater;
    if(e.st==='run'){
      e.x+=e.dir*125*dt;
      if(cakeG&&Math.abs(e.x-cakeG.x)<8){e.st='say';e.tm=3.4;cakeG=null;bonusUnlocked=true;sfx.egg();sparks(e.x,626,['#ffd24a','#fff3b0'],10,120)}
    }else if(e.st==='say'){
      e.tm-=dt;if(e.tm<=0){e.st='leave';e.dir=e.home}
    }else{

  }
  if(wk<1){ctx.globalAlpha=1-wk;drawClouds();ctx.globalAlpha=1}

    ctx.globalAlpha=1-wk;
    if(planes[1].on)drawB25(planes[1]);
    drawB25(planes[0]);
    if(boss.on)drawBoss();
    ctx.globalAlpha=1;
  }
  if(win)drawVillagers();
  for(const c of charms)drawCharm(c);
  for(const b of bombs)drawBomb(b);

function makeCloud(w,h,seed,color,shade){
  const c=document.createElement('canvas'),pw=Math.round(w/4),ph=Math.round(h/4);
  c.width=pw;c.height=ph;const g=c.getContext('2d');
  let s=seed;const rr=()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296};
  const blob=(cx,cy,rx,ry,col)=>{g.fillStyle=col;for(let dy=-ry;dy<=ry;dy++){const ww=Math.round(rx*Math.sqrt(1-dy*dy/(ry*ry)));g.fillRect(Math.round(cx-ww),Math.round(cy+dy),ww*2,1)}};
  for(let i=0;i<7;i++){
    const cx=pw*(.18+.64*rr()),cy=ph*(.4+.2*rr()),rx=pw*(.16+.1*rr()),ry=ph*(.26+.14*rr());
    blob(cx,cy+2,rx,ry,shade);
  }
  s=seed;
  for(let i=0;i<7;i++){
    const cx=pw*(.18+.64*rr()),cy=ph*(.4+.2*rr()),rx=pw*(.16+.1*rr()),ry=ph*(.26+.14*rr());
    blob(cx,cy-1,rx,ry,color);
  }
  return c;
}

function polyInside(x,y,poly){
  let c=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const a=poly[i],b=poly[j];
    if((a.y>y)!==(b.y>y)&&x<(b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x)c=!c;
  }
  return c;
}
function segX(a,b,c,d){
  const rx=b.x-a.x,ry=b.y-a.y,sx=d.x-c.x,sy=d.y-c.y,den=rx*sy-ry*sx;
  if(Math.abs(den)<1e-9)return null;
  const u=((c.x-a.x)*ry-(c.y-a.y)*rx)/den,v=((c.x-a.x)*sy-(c.y-a.y)*sx)/den;
  return(u>=0&&u<=1&&v>=0&&v<=1)?{x:a.x+v*rx,y:a.y+v*ry}:null;
}
const BAT_PTS=[[0,0],[34,0],[-34,0],[0,15],[0,-15],[22,10],[-22,10],[22,-10],[-22,-10]];
function evalLoop(poly,gapOk){
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(const p of poly){x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y)}
  if(x1-x0<34||y1-y0<34)return;
  if(x1-x0>CFG.nightMaxLoop||y1-y0>CFG.nightMaxLoop){floater((x0+x1)/2,(y0+y1)/2,'圈太大了','#ffe9b0',18);return}
  let ok=false,bad=false;
  const cnt=(cx,cy,k)=>{let n=0;for(const q of BAT_PTS)if(polyInside(cx+q[0]*k,cy+q[1]*k,poly))n++;return n};
  for(const b of bats.slice()){
    if(b.state!=='on'||b.age<.12)continue;
    const n=cnt(b.x,b.y,b.sz);
    if(n===BAT_PTS.length&&gapOk){capture(b);ok=true}
    else if(n>0){nightPenalty(b,CFG.nightIncompletePen,'沒圈住！');ns.incomplete++;bad=true}
  }
  const B=nboss;
  if(B&&B.age>=.8&&B.inv<=0){
    const n=cnt(B.x,B.y,1.7);
    if(n===BAT_PTS.length&&gapOk){hitBoss();ok=true}
    else if(n>0){floater(B.x,B.y-70,'沒圈住！','#ff6a4a',18);sfx.miss();bad=true}
  }
  flashes.push({pts:poly.slice(),age:0,ok:ok||!bad});
}

function updNightBoss(dt){
  const B=nboss;
  B.age+=dt;B.inv=Math.max(0,B.inv-dt);B.boost=Math.max(0,B.boost-dt);B.tt-=dt;
  if(B.tt<=0||Math.hypot(B.tx-B.x,B.ty-B.y)<30){B.tx=rand(90,310);B.ty=rand(140,600);B.tt=rand(1,2)}
  let ax=0,ay=0;                                   // 閃避其他蝙蝠，避免重疊
  for(const b of bats){if(b.state==='dying')continue;const dx=B.x-b.x,dy=B.y-b.y,dd=Math.hypot(dx,dy)||1,R=150*Math.max(1,b.sz*.9);
    if(dd<R){const w=(1-dd/R)*2.2;ax+=dx/dd*w;ay+=dy/dd*w}}
  const sp=CFG.nightBossSpeed*(lp&&lp.len>30?.5:1)*(B.boost>0?1.9:1),d=Math.hypot(B.tx-B.x,B.ty-B.y)||1;
  const k=Math.min(1,dt*2.5);
  B.vx+=((B.tx-B.x)/d*sp+ax*sp-B.vx)*k;B.vy+=((B.ty-B.y)/d*sp+ay*sp-B.vy)*k;
  B.x=clamp(B.x+B.vx*dt,80,320);B.y=clamp(B.y+B.vy*dt,130,620);

  B.fl-=dt;

}

function nightMove(p){
  if(!lp)return;
  const l=lp.pts[lp.pts.length-1],d=Math.hypot(p.x-l.x,p.y-l.y);
  if(d<4)return;
  lp.pts.push({x:p.x,y:p.y});lp.len+=d;
  if(lp.len>950){lp.pts=[{x:p.x,y:p.y}];lp.len=0;return}
  const pts=lp.pts,n=pts.length;
  if(n>=5){
    for(let i=0;i<n-3;i++){
      const x=segX(pts[i],pts[i+1],pts[n-2],pts[n-1]);
      if(x){
        let len=0;for(let k=i+1;k<n-1;k++)len+=Math.hypot(pts[k+1].x-pts[k].x,pts[k+1].y-pts[k].y);
        if(len<70)continue;
        evalLoop([x].concat(pts.slice(i+1,n-1),[x]),true);
        lp.pts=[{x:p.x,y:p.y}];lp.len=0;return;
      }
    }
  }
  if(lp.len>=110){
    const s=pts[0];
    if(Math.hypot(p.x-s.x,p.y-s.y)<28){evalLoop(pts.slice(),true);lp.pts=[{x:p.x,y:p.y}];lp.len=0}
  }
}
function endLoop(){
  if(lp&&lp.len>=90){
    const pts=lp.pts,gap=Math.hypot(pts[0].x-pts[pts.length-1].x,pts[0].y-pts[pts.length-1].y);
    evalLoop(pts.slice(),gap<=70);
  }
  lp=null;
}

  parts=parts.filter(p=>p.life>0);

}
function updateNight(dt){
  t+=dt;
  for(const c of nClouds){c.x+=c.s*dt;if(c.x>W+20)c.x=-c.w-20}
  updFx(dt);
  for(const r of rings)r.age+=dt;
  rings=rings.filter(r=>r.age<.6);
  for(const f of flashes)f.age+=dt;
  flashes=flashes.filter(f=>f.age<.4);
  announce=Math.max(0,announce-dt);
  const slot=Math.floor(t/20);
  if(slot!==nSlot){nSlot=slot;if(!nEnding&&t<CFG.nightDuration){announce=1.8;annMsg=BG_NAMES[Math.min(2,slot)];sfx.egg()}}
  const B=t>=CFG.nightPhaseAt;
  if(B&&!nPhase2){nPhase2=true;announce=2;annMsg=['夜婆精加速！','出現、消失都更快了'];sfx.alarm();shake=.4}
  shake=Math.max(0,shake-dt*1.5);
  if(!nEnding){
    if(!nboss&&!nbDead&&t>=CFG.nightBossAt)spawnNightBoss();
    if(nboss)updNightBoss(dt);
    if(state!=='night')return;
    nSpawn-=dt;
    const alive=bats.filter(b=>b.state!=='dying').length,cap=t<10?2:CFG.nightMax;
    if(nSpawn<=0&&alive<cap){spawnBat();nSpawn=B?rand(.25,.6):rand(.5,1)}
    for(const b of bats){
      if(b.state==='on'){b.age+=dt;if(b.age>=b.life){ns.timeout++;nightPenalty(b,CFG.nightTimeoutPen,'逃走了！')}}
      else if(b.state==='warp'){b.wt-=dt;if(b.wt<=0)relocate(b)}
      else if(b.state==='dying'){b.wt-=dt}
    }
    bats=bats.filter(b=>!(b.state==='dying'&&b.wt<=0));
    if(t>=CFG.nightDuration){
      nEnding=true;nEndT=0;lp=null;
      if(nboss){sparks(nboss.x,nboss.y,['#7a48a8','#fff'],24,160);nboss=null}
      for(const b of bats){b.state='dying';b.wt=.5;sparks(b.x,b.y,['#7a48a8','#fff'],14,140)}
      sfx.win();
    }
  }else{
    nEndT+=dt;
    for(const b of bats)b.wt-=dt;
    bats=bats.filter(b=>b.wt>0);
    if(nEndT>1.3)endNight();
  }
}

      ctx.fillStyle='#ffd24a';ctx.beginPath();ctx.arc(46,340+i*34,10,0,6.283);ctx.fill();
      txt(String(i+1),46,341+i*34,13,'#4a1a10','center',null);
      txt(s,66,340+i*34,i===6?14:15,i===6?'#ffb0a0':'#fff3d0','left','#1a0a28',4);
    });
    button('開始收服！',STORY_BTN);
  }
  if(e<.5){ctx.fillStyle='rgba(255,255,255,'+(.5-e)*1.6+')';ctx.fillRect(0,0,W,H)}
}
function drawBonus(){
  ctx.save();
  if(state==='night'&&shake>0)ctx.translate(rand(-1,1)*shake*8,rand(-1,1)*shake*8);
  if(state==='story'){drawStory();ctx.restore();
    R('rgba(0,0,0,.5)',362,8,30,26);R('#fff',368,17,4,8);R('#fff',372,14,3,14);
    if(!muted){R('#fff',379,17,2,8);R('#fff',383,14,2,14)}
    else{ctx.strokeStyle='#ff5a4a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(378,14);ctx.lineTo(388,28);ctx.moveTo(388,14);ctx.lineTo(378,28);ctx.stroke()}
    return}
  {
    const sc=[sceneN,sceneN2,sceneN3],slot=Math.min(2,Math.floor(t/20)),fade=clamp((t-slot*20)/1.2,0,1);
    if(slot>0&&fade<1){ctx.drawImage(sc[slot-1],0,0,W,H);ctx.globalAlpha=fade;ctx.drawImage(sc[slot],0,0,W,H);ctx.globalAlpha=1}
    else if(sc[slot])ctx.drawImage(sc[slot],0,0,W,H);
  }
  // 雲影
  ctx.imageSmoothingEnabled=false;
  for(const c of nClouds){ctx.globalAlpha=.16;ctx.drawImage(c.sh,rnd(c.x+36),rnd(c.y+64),c.w,c.h)}
  ctx.globalAlpha=1;
  for(const b of bats)drawBat(b);
  drawNightBoss();
  for(const r of rings){
    if(r.age<0)continue;
    const k=r.age/.6;ctx.strokeStyle='rgba(255,226,120,'+(1-k)+')';ctx.lineWidth=5*(1-k)+1;
    ctx.beginPath();ctx.arc(r.x,r.y,20+k*60,0,6.283);ctx.stroke();
  }
  for(const f of flashes){
    const k=f.age/.4;
    ctx.beginPath();f.pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();
    ctx.fillStyle=(f.ok?'rgba(255,226,120,':'rgba(255,90,70,')+(.3*(1-k))+')';ctx.fill();
    ctx.strokeStyle=(f.ok?'rgba(255,240,170,':'rgba(255,120,100,')+(1-k)+')';ctx.lineWidth=4;ctx.stroke();
  }
  if(lp&&lp.pts.length>1){
    ctx.lineCap='round';ctx.lineJoin='round';
    for(const [c,w] of [['rgba(255,200,80,.45)',11],['rgba(255,245,190,.95)',4]]){
      ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();
      lp.pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();
    }
  }
  drawFx();
  drawNightClouds(.3);
  ctx.restore();
  drawNightHud();
}

/* ====== 輸入 ====== */
const ptrs=new Map();
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
function togglePause(){
  if(state!=='play'&&state!=='night')return;
  paused=!paused;ptrs.clear();trail=[];lp=null;
}
let linkDown=null;
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const wasRunning=!!(ac&&ac.state==='running');audioInit();
  linkDown=linkAt(pos(e));if(linkDown)return;
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  const p=pos(e);
  if(p.x>=358&&p.y<40){muted=!muted;return}
  if((state==='play'||state==='night')&&p.x>=322&&p.x<358&&p.y<40){togglePause();return}
  if(state==='title'){if(CFG.testButton&&inRect(p,TESTBTN)){startBonusTest();return}
    if(!wasRunning){musStart();return}      // 瀏覽器需先互動才能出聲：第一次點擊先開啟標題音樂
    startGame();ptrs.set(e.pointerId,{x:p.x,y:p.y,dx:0,dy:0});return}
  if(state==='story'){
    if(storyPage===0){if(storyDone()){storyPage=1;storyT=0}else storyT=1e4}
    else if(storyT>.5&&inRect(p,STORY_BTN))startNight();
    return;
  }
  if(state==='win'||state==='lose'){
    if(endT>(state==='win'?2.2:1.9)&&inRect(p,BTN))startGame();
    return;
  }
  if(paused){
    if(inRect(p,PB1))togglePause();
    else if(inRect(p,PB2))startGame();
    return;
  }
  if(state==='night'){lp={id:e.pointerId,pts:[{x:p.x,y:p.y}],len:0};return}
  ptrs.set(e.pointerId,{x:p.x,y:p.y,dx:0,dy:0});
});
cv.addEventListener('pointermove',e=>{
  if(state==='night'&&!paused&&lp&&lp.id===e.pointerId){e.preventDefault();nightMove(pos(e));return}
  const q=ptrs.get(e.pointerId);if(!q)return;
  e.preventDefault();
  if(paused||state!=='play')return;
  const p=pos(e),mx=p.x-q.x,my=p.y-q.y;
  if(mx===0&&my===0)return;
  q.dx=q.dx*.5+mx*.5;q.dy=q.dy*.5+my*.5;     // 平滑撥動方向，避免手抖造成誤判
  trail.push({x0:q.x,y0:q.y,x1:p.x,y1:p.y,age:0});
  slash(q.x,q.y,p.x,p.y,q.dx,q.dy);
  q.x=p.x;q.y=p.y;
});
const endPtr=e=>{ptrs.delete(e.pointerId)};
cv.addEventListener('pointerup',e=>{
  endPtr(e);
  if(lp&&lp.id===e.pointerId){if(state==='night'&&!paused)endLoop();else lp=null}
  const L=linkAt(pos(e));
  if(L&&L===linkDown){try{window.open(L.url,'_blank','noopener,noreferrer')}catch(_){}}
  linkDown=null;
});
cv.addEventListener('pointermove',e=>{cv.style.cursor=linkAt(pos(e))?'pointer':''});
cv.addEventListener('pointerleave',()=>{cv.style.cursor=''});
cv.addEventListener('pointercancel',e=>{endPtr(e);if(lp&&lp.id===e.pointerId)lp=null});
cv.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'||e.key==='p'||e.key==='P'||e.key===' '){e.preventDefault();togglePause()}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(state==='play'||state==='night')&&!paused)togglePause()});

/* ====== 主迴圈 ====== */
let last=0;
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);
  last=ts;
  if(!paused)update(dt);
  draw();
  requestAnimationFrame(frame);
}
reset();
resize();
audioInit();musStart();      // 標題畫面音樂（若瀏覽器擋自動播放，第一次點擊後才會出聲）
if(location.hash==='#bonus'){bonusUnlocked=true;score=500;state='play';enterStory()}   // 網址加 #bonus 可直接測試隱藏關卡
requestAnimationFrame(frame);
/*DEBUG_HOOK*/
})();
</script>
