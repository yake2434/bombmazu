let ac=null,muted=false;
function audioInit(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}

}
function tone(f,d,type,v,slide){
  if(!ac||muted)return;
  const t0=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t0+d);
  g.gain.setValueAtTime(v||.06,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);
  o.connect(g);g.connect(ac.destination);o.start();o.stop(t0+d);
}
function noise(d,v){
  if(!ac||muted)return;
  const n=(ac.sampleRate*d)|0,buf=ac.createBuffer(1,n,ac.sampleRate),da=buf.getChannelData(0);
  for(let i=0;i<n;i++)da[i]=(Math.random()*2-1)*(1-i/n);
  const s=ac.createBufferSource();s.buffer=buf;
  const g=ac.createGain();g.gain.value=v;
  const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=900;
  s.connect(f);f.connect(g);g.connect(ac.destination);s.start();
}

/* ====== 背景音樂：戰鼓＋低音＋嗩吶式旋律，速度隨階段加快 ====== */
const MUS={on:false,next:0,step:0,timer:null,nb:null};
const mf=m=>440*Math.pow(2,(m-69)/12);
function mtone(f,t0,d,type,v,slide,lp){
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t0+d);
  g.gain.setValueAtTime(.0001,t0);g.gain.linearRampToValueAtTime(v,t0+.008);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  let n=o;
  if(lp){const fl=ac.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;o.connect(fl);n=fl}
  n.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+d+.02);
}
function mnoise(t0,d,v,hp){
  if(!MUS.nb){
    const n=ac.sampleRate,b=ac.createBuffer(1,n,ac.sampleRate),da=b.getChannelData(0);
    for(let i=0;i<n;i++)da[i]=Math.random()*2-1;MUS.nb=b;
  }
  const s=ac.createBufferSource();s.buffer=MUS.nb;
  const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=hp;
  const g=ac.createGain();g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  s.connect(f);f.connect(g);g.connect(ac.destination);s.start(t0,Math.random()*.5);s.stop(t0+d+.02);
}
const M_ROOT=[33,33,29,28];                       // A A F E：帶有緊張感的下行
const M_MEL=[[0,76,4],[4,74,2],[6,72,2],[8,69,6],[14,72,2],[16,76,4],[20,79,4],[24,76,4],[28,74,4],
  [32,77,4],[36,76,2],[38,74,2],[40,72,6],[46,74,2],[48,76,6],[54,75,2],[56,76,4],[60,71,4]];
function musStep(st,t0,lvl){
  const bar=(st>>4)&3,s=st&15,root=M_ROOT[bar];
  // 戰鼓
  if(s===0||s===8)mtone(125,t0,.3,'sine',.26,-70);
  if(s===6||s===14||(lvl>0&&s===10))mtone(150,t0,.18,'sine',.13,-80);
  if(lvl>0&&(s===4||s===12))mnoise(t0,.12,.08,1800);
  if(lvl>0?(s%2===0):(s%4===2))mnoise(t0,.04,.035,6500);
  // 低音
  const bassOn=lvl>0?(s%2===0):[0,4,6,8,12,14].includes(s);
  if(bassOn)mtone(mf(root+((s===6||s===14)?12:0)),t0,.2,'sawtooth',s===0?.1:.065,0,380);
  // 不安的高音（第一階段）
  if(lvl===0&&s===0&&(bar&1)===0)mtone(mf(81+(bar?1:0)),t0,1.6,'sine',.02,0);
  // 旋律
  if(lvl>=1){
    for(const m of M_MEL)if(m[0]===(st%64)){
      mtone(mf(m[1]),t0,m[2]*60/(lvl>1?150:132)/4*.95,'square',.034,0,2600);
      mtone(mf(m[1])*1.003,t0,m[2]*60/(lvl>1?150:132)/4*.95,'sawtooth',.02,0,2200);
    }
  }
  // Boss：十六分音符琶音＋警報和弦
  if(lvl>=2){
    const arp=[0,3,7,12,7,3,0,-2];
    mtone(mf(root+24+arp[s%8]),t0,.09,'square',.03,0,2000);
    if(s===0)mtone(mf(root+36),t0,.5,'sawtooth',.03,0,1500),mtone(mf(root+42),t0,.5,'sawtooth',.025,0,1500);
  }
}
function musTick(){

  if(state!=='play'){musStop();return}

}

}

function R(c,x,y,w,h){
  ctx.fillStyle=c;
  const w2=w>0?Math.max(1,rnd(w)):0,h2=h>0?Math.max(1,rnd(h)):0;
  ctx.fillRect(rnd(x),rnd(y),w2,h2);
}
function spr(map,pal,x,y,px){
  for(let j=0;j<map.length;j++){
    const row=map[j];
    for(let i=0;i<row.length;i++){
      const ch=row[i];if(ch==='.')continue;
      ctx.fillStyle=pal[ch];
      ctx.fillRect(rnd(x+i*px),rnd(y+j*px),px+.4,px+.4);
    }
  }
}

}

  return STOPS[3][1];
}

function tileRoof(cx,top,h,topW,botW,tip){
  for(let r=0;r<h;r+=2){
    const w=topW+(botW-topW)*r/h,x=cx-w/2;
    R(r>h*.78?'#8a2e22':'#a8402e',x,top+r,w,2);
    for(let i=2;i<w-1;i+=4)R('#cc6040',x+i,top+r,1,2);
  }
  R('#ecd08a',cx-botW/2,top+h,botW,2);
  R('#6a1e18',cx-botW/2,top+h+2,botW,2);
  R('#e0b040',cx-topW/2-2,top-3,topW+4,3);
  for(let i=0;i<topW;i+=6)R('#2aa060',cx-topW/2+i,top-5,3,2);
  if(tip){
    for(const sd of [-1,1]){
      const x0=cx+sd*botW/2,y0=top+h;
      for(let k=0;k<8;k++){
        const x=x0+sd*k*2.2-(sd<0?3:0),y=y0-2-Math.pow(k,1.7)*.55;
        R(k>5?'#e8b830':'#a8402e',x,y,3,3);
        R('#ecd08a',x,y+3,3,1);
      }
    }
  }
}
function ornRow(x,y,w,h,seed){
  const pal=['#e8b830','#2aa060','#d8281c','#2a8a9a','#f0e0b0','#c06020'];
  for(let j=0;j<h;j+=3)for(let i=0;i<w;i+=3){
    const n=hs(i*131+j*17+seed);
    if(n%100<80)R(pal[n%pal.length],x+i,y+j,3,3);
  }
}
function ornTri(cx,baseY,w,h,seed,fin){
  const pal=['#e8b830','#2aa060','#d8281c','#2a8a9a','#f0e0b0','#c06020','#e8b830'];
  for(let j=0;j<h;j+=3){
    const rw=w*(1-Math.pow(j/h,1.6)*.8);
    for(let i=-rw/2;i<rw/2;i+=3){
      const n=hs((rnd(i)+200)*131+j*17+seed);
      if(n%100<78)R(pal[n%pal.length],cx+i,baseY-j-3,3,3);
    }
  }
  if(fin){
    R('#e8b830',cx-1,baseY-h-14,2,14);R('#d8281c',cx-4,baseY-h-8,8,3);R('#e8b830',cx-3,baseY-h-5,6,2);
  }
}

  if(r<.15)return 'cl';if(r<.28)return 'hv';if(r<.43)return 'dv';return 'n';
}
function newBomb(x,y,vx,vy,s0,type){
  const mul=type==='hv'?1.4:type==='cl'?1.1:1;
  return{
    x:clamp(x,20,380),y,vx,vy,s:s0*mul,s0,type,
    sf:(.8+.35*(s0-.7)/.6)*(type==='hv'?.82:1),landY:598+(s0-.7)/.6*52,
    rot:0,spin:0,age:0,state:'fall',noHit:false,dt:0,dead:false,
    hp:type==='hv'?2:1,cd:0,pen:type==='hv'?CFG.heavyPenalty:type==='dv'?CFG.divePenalty:CFG.bombPenalty,
    diveY:rand(190,260),dvT:0,dvGo:false,split:rand(270,340)
  };
}
function introType(type){
  if(type==='n'||seenTypes[type])return;
  seenTypes[type]=1;tip.text=TIPS[type];tip.t=3.2;
}
function dropBomb(p,offx,type){
  type=type||pickType();
  const sp=planeSpeed(p),s0=p===planes[0]?rand(.95,1.25):rand(.7,.85);
  bombs.push(newBomb(p.x-p.dir*3+(offx||0),p.y+19*p.s,p.dir*sp*.35+rand(-15,15),50,s0,type));
  introType(type);
  p.drop=.18;
  if(p===planes[0])sfx.drop();
}
function bossDrop(){
  const type=pickType();
  bombs.push(newBomb(boss.x+rand(-30,30),boss.y+34,rand(-25,25),50,rand(.95,1.2),type));
  introType(type);sfx.drop();
}
function bossHit(b){
  boss.hp--;boss.hit=.18;
  boom(b.x,b.y,false);sfx.bossHit();shake=.25;
  floater(b.x,b.y-10,'命中！','#ffd24a',22);
  if(boss.hp<=0&&!boss.dead){
    boss.dead=true;boss.dieT=0;
    score+=CFG.bossBonus;flash=.9;shake=.7;
    floater(200,300,'擊落 Boss！ +'+CFG.bossBonus,'#ffd24a',32);
    sfx.boom();setTimeout(()=>sfx.win(),200);
    for(const q of bombs){if(q.state==='fall'){q.state='def';q.vx=rand(-200,200);q.vy=-rand(150,300);q.spin=rand(-10,10);q.dt=rand(.15,.5)}}
  }
}
function spawnCharm(){
  charms.push({x0:rand(50,350),x:0,y:-24,vy:phase2?105:85,age:0,ph:rand(0,6),r:20,landY:616,dead:false});
}

/* ====== 判定：往上或左右撥開成功，往下撥則失敗 ====== */
function dseg(px,py,x0,y0,x1,y1){
  const dx=x1-x0,dy=y1-y0,l2=dx*dx+dy*dy;
  let u=l2?((px-x0)*dx+(py-y0)*dy)/l2:0;u=clamp(u,0,1);
  return Math.hypot(px-(x0+u*dx),py-(y0+u*dy));
}
function bombHit(b,x0,y0,x1,y1){
  const ax=-Math.sin(b.rot),ay=Math.cos(b.rot),h=20*b.s,r=12*b.s+CFG.hitPad;
  for(let k=-2;k<=2;k++)if(dseg(b.x+ax*h*k/2,b.y+ay*h*k/2,x0,y0,x1,y1)<=r)return true;
  return false;
}
// (x0,y0)-(x1,y1)：這一小段實際軌跡；(dx,dy)：平滑後的撥動方向
function slash(x0,y0,x1,y1,dx,dy){
  if(state!=='play'||paused)return;
  const len=Math.hypot(dx,dy);
  if(len<3)return;                       // 沒有明確方向（單純點一下）不算撥動
  if(clock-lastSlash>.1){lastSlash=clock;sfx.slash()}
  const ux=dx/len,uy=dy/len,sp=420+Math.min(len,60)*4;
  for(const b of bombs){
    if(b.state!=='fall'||b.noHit||b.cd>0)continue;
    if(!bombHit(b,x0,y0,x1,y1))continue;
    if(uy<CFG.downLimit){
      if(b.hp>1){
        // 重磅炸彈：第一下只是打偏，要再撥一次
        b.hp--;b.cd=.3;b.vy=-110;b.vx+=ux*90;
        sparks(b.x,b.y,['#fff','#ffb020'],10,200);
        floater(b.x,b.y-24,'再撥一次！','#ffd24a',20);sfx.clang();continue;
      }
      // 往上或左右：彈飛成功
      b.state='def';
      b.vx=ux*sp;b.vy=Math.min(uy*sp-120,-50);
      b.spin=(Math.random()<.5?-1:1)*rand(8,14);b.dt=(boss.on&&!boss.dead)?.85:.5;
      stats.deflected++;
      gain(b.type==='hv'?CFG.heavyBonus:b.type==='cl'?CFG.clusterBonus:b.type==='dv'?CFG.diveBonus:CFG.deflectBonus,b.x,b.y-20);
      sparks(b.x,b.y,['#fff','#ffe27a','#ffb020'],10,220);
      sfx.deflect();
    }else{
      // 往下撥：炸彈被打向地面，仍會造成損失
      b.noHit=true;b.knocked=true;
      b.vx=ux*120;b.vy=Math.max(b.vy,260);
      stats.knocked++;breakCombo();
      sparks(b.x,b.y,['#ff6a4a','#ffb020'],8,160);
      floater(b.x,b.y-20,'往下撥了！','#ff8a6a',18);
      sfx.wrong();
    }
  }
  if(cake&&!cake.dead&&dseg(cake.x,cake.y,x0,y0,x1,y1)<=22+CFG.hitPad){
    cake.dead=true;cake=null;sparks(x0,y0,['#e8a640','#f4e2a8'],6,100);sfx.poof();   // 被揮走：什麼事也不會發生
  }
  for(const c of charms){
    if(c.dead)continue;
    if(dseg(c.x,c.y,x0,y0,x1,y1)<=c.r+CFG.hitPad){
      c.dead=true;stats.swept++;
      sparks(c.x,c.y,['#d8c46a','#9a8a50','#fff'],10,120);
      floater(c.x,c.y,'符咒被揮散…','#cfc7a0',16);
      sfx.poof();
    }
  }
}

const SHIRTS=['#c8402e','#3a6aa8','#e8c040','#4a8a4a','#f0f0e0','#a04a8a','#d8782a'];
function finish(win){
  if(state!=='play')return;
  endT=0;loseT=0;fwT=0;paused=false;
  if(win){
    state='win';
    for(const b of bombs){if(b.state==='fall'){b.state='def';b.vx=rand(-200,200);b.vy=-rand(150,300);b.spin=rand(-10,10);b.dt=rand(.15,.5)}}
    charms=[];bgBooms=[];decorBombs=[];flash=.6;cake=null;cakeG=null;eater=null;
    villagers=[];
    for(let i=0;i<11;i++){
      const y=rand(610,692);
      villagers.push({x:rand(24,376),y,s:.7+(y-600)/92*.55,shirt:pick(SHIRTS),hat:Math.random()<.4,kid:Math.random()<.25,ph:rand(0,6)});
    }
    villagers.sort((a,b)=>a.y-b.y);
    if(score>best){best=score;try{localStorage.setItem('mazuBest',String(best))}catch(e){}}
    sfx.win();
  }else{
    state='lose';score=0;cake=null;cakeG=null;eater=null;sfx.lose();
  }
}

/* ====== 更新 ====== */
function update(dt){
  clock+=dt;
  for(const c of dayClouds){c.x+=c.s*dt;if(c.x>420)c.x=-c.w}
  if(state!=='win'){
    bgTimer-=dt;
    if(bgTimer<=0){
      bgTimer=rand(.22,.6);
      const r=Math.random();
      if(r<.5)bgBooms.push({x:rand(20,380),y:rand(140,420),age:0,max:rand(.7,1.2),R:rand(22,56),k:0});
      else if(r<.8)bgBooms.push({x:rand(10,390),y:rand(470,525),age:0,max:rand(.6,1),R:rand(14,30),k:0});
      else bgBooms.push({x:rand(20,380),y:rand(130,340),age:0,max:rand(1.2,2),R:rand(10,18),k:1,sd:(Math.random()*999)|0});
      if(Math.random()<.25)skyFlash=.25;
    }
    for(const d of decor){
      d.x+=d.dir*d.v*dt;
      if(d.x>460)d.x=-60;if(d.x<-60)d.x=460;
      d.t-=dt;
      if(d.t<=0){d.t=rand(2.5,5);decorBombs.push({x:d.x,y:d.y+6,vy:60,ly:rand(485,530)})}
    }
  }
  for(const b of bgBooms)b.age+=dt;
  bgBooms=bgBooms.filter(b=>b.age<b.max);
  for(const b of decorBombs){
    b.vy+=120*dt;b.y+=b.vy*dt;
    if(b.y>=b.ly){b.dead=true;bgBooms.push({x:b.x,y:b.y,age:0,max:rand(.6,.9),R:rand(14,24),k:0})}
  }
  decorBombs=decorBombs.filter(b=>!b.dead);
  for(const c of clouds){c.x-=c.s*dt;if(c.x+c.w<-10){c.x=410;c.y=rand(130,420)}}
  for(const e of embers){e.y-=e.v*dt;e.x+=Math.sin(clock*2+e.p)*10*dt;if(e.y<-4){e.y=BASE;e.x=rand(0,400)}}
  skyFlash=Math.max(0,skyFlash-dt*1.5);
  shake=Math.max(0,shake-dt);
  flash=Math.max(0,flash-dt*1.6);
  glow=Math.max(0,glow-dt*.7);
  announce=Math.max(0,announce-dt);

  for(const p of planes){
    if(!p.on)continue;
    p.x+=p.dir*planeSpeed(p)*dt;
    if(p.x>330&&p.dir>0)p.dir=-1;
    if(p.x<70&&p.dir<0)p.dir=1;
    p.drop=Math.max(0,p.drop-dt);
  }

  if(boss.on){
    boss.x+=boss.dir*(boss.dead?0:62)*dt;
    if(boss.x>300)boss.dir=-1;
    if(boss.x<110&&boss.dir<0)boss.dir=1;
    boss.hit=Math.max(0,boss.hit-dt);
    if(boss.dead){
      boss.dieT+=dt;boss.y+=40*dt;
      if(Math.random()<.5){boom(boss.x+rand(-60,60),boss.y+rand(-14,14),Math.random()<.4);}
      if(boss.dieT>1.4)boss.on=false;
    }
  }
  tip.t=Math.max(0,tip.t-dt);
  if(state==='play'){
    t+=dt;
    if(!boss.on&&!boss.dead&&t>=CFG.bossAt){
      boss.on=true;boss.x=-140;boss.dir=1;boss.y=206;boss.hp=CFG.bossHP;boss.nb=1.4;
      planes[1].on=false;
      announce=2.6;annMsg=['最後 10 秒！','Boss 來襲　落地扣分加倍'];shake=.6;sfx.alarm();
    }
    if(boss.on&&!boss.dead&&boss.x>40){
      boss.nb-=dt;
      if(boss.nb<=0){boss.nb=rand(1.0,1.5);bossDrop()}
    }
    if(!phase2&&t>=CFG.phaseAt){
      phase2=true;announce=2.2;annMsg=['轟炸加劇！','落地扣分提高　遠方轟炸機加入'];shake=.6;sfx.alarm();
      Object.assign(planes[1],{x:-80,dir:1,on:true,nb:1.2});
    }
    for(const p of planes){
      if(!p.on)continue;
      p.nb-=dt;
      if(p.nb<=0){
        const iv=p===planes[0]?(phase2?CFG.bombInt2:CFG.bombInt1):CFG.bombIntB;
        p.nb=rand(iv[0],iv[1]);
        if(p.x<20||p.x>380)continue;
        dropBomb(p,0);
        if(p===planes[0]&&phase2&&Math.random()<.15)dropBomb(p,rand(-70,70),'n');
      }
    }
    if(egg.planned&&!egg.done&&t>=egg.at){
      egg.done=true;cake={x0:rand(70,330),x:0,y:-24,vy:78,age:0,ph:rand(0,6)};
    }
    nextCharm-=dt;
    if(nextCharm<=0){
      const iv=phase2?CFG.charmInt2:CFG.charmInt1;
      nextCharm=rand(iv[0],iv[1]);
      spawnCharm();
    }
  }

  const g=phase2?CFG.g2:CFG.g1,maxV=phase2?480:400;
  for(const b of bombs){
    b.age+=dt;b.cd=Math.max(0,b.cd-dt);
    if(b.state==='fall'&&b.type==='cl'&&!b.noHit&&b.y>=b.split){
      b.dead=true;sfx.split();sparks(b.x,b.y,['#ffb020','#ff7a20','#fff'],14,200);
      for(const k of [-1,0,1]){
        const nb=newBomb(b.x+k*10,b.y,b.vx+k*85,Math.max(b.vy*.85,60),b.s0,'n');
        nb.s=b.s0*.62;nb.landY=b.landY;nb.pen=CFG.splitPenalty;bombs.push(nb);
      }
      floater(b.x,b.y-30,'散開！','#ff9a4a',20);
      continue;
    }
    if(b.state==='fall'&&b.type==='dv'&&!b.knocked&&!b.dvGo&&b.y>=b.diveY){
      b.dvT+=dt;b.vy=12;b.vx*=.2;
      if(b.dvT>=.55){b.dvGo=true;b.vy=320;sfx.dive()}
    }
    if(b.state==='fall'){
      if(b.type==='dv'&&b.dvGo&&!b.knocked)b.vy=Math.min(b.vy+900*dt,640*b.sf);
      else if(!(b.type==='dv'&&b.dvT>0&&!b.dvGo))b.vy=Math.min(b.vy+g*b.sf*dt,(b.knocked?560:maxV)*b.sf);
      b.x+=b.vx*dt;b.y+=b.vy*dt;
      b.vx*=Math.pow(.6,dt);
      if(b.x<10){b.x=10;b.vx=Math.abs(b.vx)}
      if(b.x>390){b.x=390;b.vx=-Math.abs(b.vx)}
      b.rot=Math.atan2(-b.vx,b.vy)+(b.knocked?0:Math.sin(b.age*8)*.08);
      if(Math.random()<.25)parts.push({x:b.x,y:b.y-20*b.s,vx:rand(-10,10),vy:-rand(10,40),life:.4,max:.4,c:b.knocked?'#ff6a4a':'#ffb020',s:2,g:0,grow:0,a:1});
      if(b.y>=b.landY){
        b.dead=true;
        boom(b.x,b.landY-4,true);sfx.boom();shake=.5;
        if(state==='play'){
          chain=(t-lastHitT<=CFG.chainWindow)?Math.min(CFG.chainMax,chain+1):0;lastHitT=t;
          const mulP=(boss.on&&!boss.dead)?CFG.bossPenMul:phase2?CFG.phase2PenMul:1;
          const pen=Math.round(b.pen*mulP)+chain*CFG.chainPen+(score>150?Math.round((score-150)*CFG.pctPen):0);
          score-=pen;stats.hit++;flash=1;breakCombo();
          floater(b.x,b.landY-34,'-'+pen,'#ff4a3a',26);
          if(chain>0)floater(b.x,b.landY-64,'連環爆！','#ff9a3a',18);
        }
      }
    }else{
      b.x+=b.vx*dt;b.y+=b.vy*dt;b.rot+=b.spin*dt;b.dt-=dt;
      if(boss.on&&!boss.dead&&state==='play'&&Math.abs(b.x-boss.x)<64&&Math.abs(b.y-boss.y)<30){b.dead=true;bossHit(b);continue}
      if(b.dt<=0||b.x<-30||b.x>430||b.y<-40||b.y>=b.landY){
        b.dead=true;
        boom(clamp(b.x,10,390),clamp(b.y,20,b.landY-10),false);sfx.pop();
      }
    }
  }
  bombs=bombs.filter(b=>!b.dead);

  for(const c of charms){
    c.age+=dt;c.y+=c.vy*dt;
    c.x=clamp(c.x0+Math.sin(c.age*2.2+c.ph)*24,16,384);
    if(c.y>=c.landY&&!c.dead){
      c.dead=true;
      if(state==='play'){
        score+=CFG.charmBonus;stats.charms++;glow=1.3;
        floater(c.x,c.landY-34,'+'+CFG.charmBonus,'#ffd24a',26);
        sparks(c.x,c.landY-10,['#ffd24a','#fff3b0','#ffffff'],18,200);
        sfx.chime();
      }
    }
  }
  charms=charms.filter(c=>!c.dead);

  if(cake){
    cake.age+=dt;cake.y+=cake.vy*dt;cake.x=clamp(cake.x0+Math.sin(cake.age*1.8+cake.ph)*18,20,380);
    if(cake.y>=628){
      cakeG={x:cake.x,y:632,age:0};
      sparks(cake.x,624,['#e8a640','#f4e2a8','#fff'],12,120);
      const fromL=cake.x<200;
      eater={x:fromL?-20:420,y:646,dir:fromL?1:-1,st:'run',tm:0,ph:rand(0,6),shirt:pick(SHIRTS),hat:Math.random()<.5,home:fromL?-1:1};
      cake=null;
    }
  }
  if(cakeG)cakeG.age+=dt;
  if(eater){
    const e=eater;
    if(e.st==='run'){
      e.x+=e.dir*125*dt;
      if(cakeG&&Math.abs(e.x-cakeG.x)<8){e.st='say';e.tm=3.4;cakeG=null;sfx.egg();sparks(e.x,626,['#ffd24a','#fff3b0'],10,120)}
    }else if(e.st==='say'){
      e.tm-=dt;if(e.tm<=0){e.st='leave';e.dir=e.home}
    }else{
      e.x+=e.dir*125*dt;
      if(e.x<-40||e.x>440)eater=null;
    }
  }

  for(const b of fxBooms)b.age+=dt;
  fxBooms=fxBooms.filter(b=>b.age<b.max);
  for(const p of parts){p.life-=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.s+=p.grow*dt}
  parts=parts.filter(p=>p.life>0);
  for(const f of floaters){f.life-=dt;f.y-=36*dt}
  floaters=floaters.filter(f=>f.life>0);
  for(const s of trail)s.age+=dt;
  trail=trail.filter(s=>s.age<.25);

  if(state==='play'){
    if(score<=0)finish(false);
    else if(t>=CFG.duration)finish(true);
  }else if(state==='win'){
    endT+=dt;fwT-=dt;
    if(fwT<=0){
      fwT=rand(.35,.7);
      const fx=rand(60,340),fy=rand(110,330),cols=pick([['#ffd24a','#fff3b0'],['#ff5a4a','#ffb020'],['#ffffff','#ffd24a'],['#ff8ad8','#ffe0f4']]);
      for(let i=0;i<36;i++){
        const a=i/36*6.283,s=rand(80,150);
        parts.push({x:fx,y:fy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.9,1.4),max:1.4,c:pick(cols),s:4,g:60,grow:0,a:1});
      }
      tone(rand(300,600),.2,'sine',.04,-150);
    }
  }else if(state==='lose'){
    endT+=dt;loseT-=dt;
    if(endT<1.3&&loseT<=0){
      loseT=.16;
      boom(rand(60,340),rand(596,650),true);sfx.boom();shake=.4;
    }
  }
}

/* ====== 繪製：天空與背景 ====== */
function skyBands(arr){
  for(let i=0;i<arr.length;i++)R(arr[i],0,i*40,W,41);
  for(let i=1;i<arr.length;i++){
    const y=i*40;
    for(let x=0;x<W;x+=8){
      R(arr[i-1],x,y,4,4);
      R(arr[i-1],x+4,y+4,4,4);
      R(arr[i],x+4,y-4,4,4);
    }
  }
}
function drawSky(a){
  skyBands(BANDS);
  if(a<=0)return;
  if(skyFlash>0){ctx.fillStyle='rgba(255,210,130,'+skyFlash*.3*a+')';ctx.fillRect(0,0,W,H)}
  ctx.fillStyle='rgba(255,240,180,'+.07*a+')';
  for(let k=0;k<2;k++){
    const bx=k?300:90,an=Math.sin(clock*.7+k*2)*.5+(k?.2:-.2);
    ctx.beginPath();ctx.moveTo(bx-6,560);ctx.lineTo(bx+Math.sin(an)*620-34,560-Math.cos(an)*620);
    ctx.lineTo(bx+Math.sin(an)*620+34,560-Math.cos(an)*620);ctx.lineTo(bx+6,560);ctx.fill();
  }
}
function drawSkyDay(){
  skyBands(DAYB);
  // 太陽
  for(let gy=-24;gy<=24;gy+=4)for(let gx=-24;gx<=24;gx+=4){
    const d=Math.hypot(gx,gy);
    if(d<=24){ctx.fillStyle=d<16?'#fff6b0':'#ffe36a';ctx.fillRect(330+gx,100+gy,4,4)}
  }
  ctx.fillStyle='rgba(255,246,176,.18)';
  for(let i=0;i<8;i++){const a=i/8*6.283+clock*.1;ctx.fillRect(330+Math.cos(a)*38-2,100+Math.sin(a)*38-2,4,4)}
  // 白雲
  for(const c of dayClouds){
    const x=rnd(c.x),y=rnd(c.y),w=rnd(c.w);
    R('#ffffff',x+8,y,w-16,8);R('#ffffff',x,y+6,w,10);R('#ffffff',x+14,y-6,w*.4,10);R('#ffffff',x+w*.5,y-3,w*.3,8);
    R('#dce8f4',x+4,y+14,w-8,3);
  }
}
function blast(x,y,Rr,k){
  const cell=4,r=Rr*(.35+.65*Math.min(1,k*2.2));
  ctx.globalAlpha=Math.max(0,1-k);
  for(let gy=-r;gy<=r;gy+=cell)for(let gx=-r;gx<=r;gx+=cell){
    const d=Math.hypot(gx,gy)/r+(((gx*7+gy*13)%5+5)%5)/50;
    if(d>1)continue;
    ctx.fillStyle=d<.35?'#fff3b0':d<.65?'#ffb020':d<.88?'#e2401c':'#6a160d';
    ctx.fillRect(rnd(x+gx),rnd(y+gy),cell,cell);
  }
  ctx.globalAlpha=1;

function flak(b){

  txt('過關！',0,0,56,'#ffd24a','center','#7a1010',11);
  ctx.restore();
  if(e>1)txt('媽祖護境　村莊平安',200,146,18,'#fff3d0','center','#1a0606',5);
}
/* 結算畫面連結（畫在 canvas 上，點擊會另開分頁） */
const LINKS=[
  {label:'◎萬丹萬惠宮粉絲專頁',url:'https://www.facebook.com/WanhuiGong',y:669},
  {label:'◎橙色的品源',url:'https://supr.link/ujJcE',y:687}
];
function drawLinks(){
  ctx.fillStyle='rgba(20,5,5,.78)';ctx.fillRect(0,640,W,60);
  R('#e0a526',0,640,W,2);
  txt('迎媽祖相關資料',200,652,13,'#ffe9b0','center',null);
  for(const L of LINKS){
    ctx.font='bold 12px "PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif';
    const w1=ctx.measureText(L.label).width;
    ctx.font='11px sans-serif';
    const w2=ctx.measureText(L.url).width,gap=8,x0=200-(w1+gap+w2)/2;
    txt(L.label,x0,L.y,12,'#ffd24a','left',null);
    ctx.font='11px sans-serif';ctx.textAlign='left';ctx.fillStyle='#8fd0ff';
    const ux=x0+w1+gap;ctx.fillText(L.url,ux,L.y);
    ctx.fillRect(ux,L.y+7,w2,1);
  }
}
function linkAt(p){
  if(!((state==='win'&&endT>2)||(state==='lose'&&endT>1.8)))return null;
  for(const L of LINKS)if(p.y>=L.y-10&&p.y<=L.y+9&&p.x>=14&&p.x<=386)return L;
  return null;
}
function drawWinPanel(){
  const e=endT;
  if(e<=2)return;
  panel(50,262,300,192);
  const stars=score>=CFG.stars[1]?3:score>=CFG.stars[0]?2:1;
  const names=['驚險過關','平安護境','神蹟顯靈'];
  let st='';for(let i=0;i<3;i++)st+=i<stars?'★':'☆';
  txt(st,200,284,28,'#ffd24a','center','#1a0606',5);
  txt(names[stars-1]+(boss.dead?'　★ 擊落 Boss':''),200,306,14,'#fff3d0','center','#1a0606',4);
  txt('最終分數　'+score,200,334,26,'#fff','center','#7a1010',6);
  txt('彈開 '+stats.deflected+' 顆　護身符 '+stats.charms+' 張　最高連擊 '+maxCombo,200,360,14,'#ffe9b0','center','#1a0606',4);
  txt('最高紀錄　'+best+(score>=best?'（新紀錄！）':''),200,382,14,'#ffd24a','center','#1a0606',4);
  button('再玩一次');
  drawLinks();
}
function drawLose(){
  const e=endT;
  ctx.fillStyle='rgba(60,0,0,'+Math.min(.4,e*.3)+')';ctx.fillRect(0,0,W,H);
  if(e>1.1){
    txt('護境失敗',200,110,52,'#ff5a4a','center','#2a0505',11);
    txt('媽祖來不及接住了…',200,158,18,'#ffd9a0','center','#1a0606',5);
  }
  if(e>1.8){
    panel(50,190,300,264);
    txt('撐過　'+Math.floor(t)+' 秒',200,224,24,'#fff','center','#7a1010',6);
    txt('彈開炸彈　'+stats.deflected+' 顆',200,266,15,'#ffe9b0','center','#1a0606',4);
    txt('漏接炸彈　'+stats.hit+' 顆　被撥下 '+stats.knocked+' 顆',200,292,15,'#ffe9b0','center','#1a0606',4);
    txt('護身符 '+stats.charms+' 張　最高連擊 '+maxCombo,200,318,15,'#ffe9b0','center','#1a0606',4);
    txt('最高紀錄　'+best,200,348,15,'#ffd24a','center','#1a0606',4);
    txt('下次一定能守住萬丹！',200,376,14,'#ffd9a0','center','#1a0606',4);
    button('再試一次');
  }
  if(e>1.8)drawLinks();
}

function draw(){
  const k=cv.width/W;
  ctx.setTransform(k,0,0,k,0,0);
  ctx.imageSmoothingEnabled=false;
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake>0)ctx.translate(rand(-1,1)*shake*10,rand(-1,1)*shake*10);
  const win=state==='win',wk=win?clamp(endT/1.6,0,1):0;
  const ruin=state==='lose'&&endT>.35;
  drawSky(1-wk);
  if(wk>0){ctx.globalAlpha=wk;drawSkyDay();ctx.globalAlpha=1}
  if(!win){
    for(const b of bgBooms){if(b.k===1)flak(b);else blast(b.x,b.y,b.R,b.age/b.max)}
    drawDecor();
  }
  if(wk<1){ctx.globalAlpha=1-wk;drawClouds();ctx.globalAlpha=1}
  const base=ruin?sceneRuin:scene;
  if(base)ctx.drawImage(base,0,0,W,H);
  if(wk>0&&sceneDay){ctx.globalAlpha=wk;ctx.drawImage(sceneDay,0,0,W,H);ctx.globalAlpha=1}
  if(ruin)drawFires();else drawDyn();
  if(!win)for(const e of embers)R('#ffcf6a',e.x,e.y,2,2);
  drawMazuGlow();
  if(wk<1&&state!=='title'){
    ctx.globalAlpha=1-wk;
    if(planes[1].on)drawB25(planes[1]);
    drawB25(planes[0]);
    if(boss.on)drawBoss();
    ctx.globalAlpha=1;
  }
  if(win)drawVillagers();
  for(const c of charms)drawCharm(c);
  for(const b of bombs)drawBomb(b);
  drawEgg();
  drawFx();
  ctx.restore();
  if(flash>0){ctx.fillStyle='rgba(255,60,40,'+flash*.35+')';ctx.fillRect(0,0,W,H)}
  if(state!=='title')drawHud();
  if(state==='title')drawTitle();
  else if(state==='win'){drawWin();drawWinPanel()}
  else if(state==='lose')drawLose();
  else if(paused)drawPause();
}

/* ====== 輸入 ====== */
const ptrs=new Map();
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
function togglePause(){
  if(state!=='play')return;
  paused=!paused;ptrs.clear();trail=[];
}
let linkDown=null;
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();audioInit();
  linkDown=linkAt(pos(e));if(linkDown)return;
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  const p=pos(e);
  if(p.x>=358&&p.y<40){muted=!muted;return}
  if(state==='play'&&p.x>=322&&p.x<358&&p.y<40){togglePause();return}
  if(state==='title'){startGame();ptrs.set(e.pointerId,{x:p.x,y:p.y,dx:0,dy:0});return}
  if(state==='win'||state==='lose'){
    if(endT>(state==='win'?2.2:1.9)&&inRect(p,BTN))startGame();
    return;
  }
  if(paused){
    if(inRect(p,PB1))togglePause();
    else if(inRect(p,PB2))startGame();
    return;
  }
  ptrs.set(e.pointerId,{x:p.x,y:p.y,dx:0,dy:0});
});
cv.addEventListener('pointermove',e=>{
  const q=ptrs.get(e.pointerId);if(!q)return;
  e.preventDefault();
  if(paused||state!=='play')return;
  const p=pos(e),mx=p.x-q.x,my=p.y-q.y;
  if(mx===0&&my===0)return;
  q.dx=q.dx*.5+mx*.5;q.dy=q.dy*.5+my*.5;     // 平滑撥動方向，避免手抖造成誤判
  trail.push({x0:q.x,y0:q.y,x1:p.x,y1:p.y,age:0});
  slash(q.x,q.y,p.x,p.y,q.dx,q.dy);
  q.x=p.x;q.y=p.y;
});
const endPtr=e=>{ptrs.delete(e.pointerId)};
cv.addEventListener('pointerup',e=>{
  endPtr(e);
  const L=linkAt(pos(e));
  if(L&&L===linkDown){try{window.open(L.url,'_blank','noopener,noreferrer')}catch(_){}}
  linkDown=null;
});
cv.addEventListener('pointermove',e=>{cv.style.cursor=linkAt(pos(e))?'pointer':''});
cv.addEventListener('pointerleave',()=>{cv.style.cursor=''});
cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'||e.key==='p'||e.key==='P'||e.key===' '){e.preventDefault();togglePause()}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'&&!paused)togglePause()});

/* ====== 主迴圈 ====== */
let last=0;
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);
  last=ts;
  if(!paused)update(dt);
  draw();
  requestAnimationFrame(frame);
}
reset();
resize();
requestAnimationFrame(frame);
/*DEBUG_HOOK*/
})();
</script>
